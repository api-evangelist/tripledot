name: Tripledot
description: 'Tripledot Studios (Tripledot Group) is a London-headquartered mobile games
  developer and publisher focused on data-driven casual games, with chart-topping titles
  including Woodoku, Solitaire, Duplica, Wordhop, Solitaire Scapes, Sudoku, Spider Solitaire
  and Blackjack played by more than 25 million daily active users. Founded as an independent
  studio and named Best Developer at the Pocket Gamer Mobile Games Awards 2023, Tripledot
  closed an $800 million acquisition of AppLovin''s mobile games studio portfolio (ten
  studios) on July 1, 2025, and is backed by investors including Lightspeed Venture
  Partners. Tripledot publishes no first-party developer API, portal or SDKs, but its
  website ships a real llms.txt and a live, publicly connectable MCP endpoint (the Wix
  Site Visitor Assistant) for agentic access to site content.'
